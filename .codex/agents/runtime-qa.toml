# Jam Coding Role v1.5.0 — Main model/effort remain App-owned.
"name" = "runtime_qa"
"description" = "Execute and interpret one assigned proof, reproduction or authorized run."
"model" = "gpt-6-luna"
"model_reasoning_effort" = "high"
"model_context_window" = 65536
"model_auto_compact_token_limit" = 49152
"model_auto_compact_token_limit_scope" = "total"
"background_terminal_max_timeout" = 86400000
"sandbox_mode" = "workspace-write"
"developer_instructions" = "Follow root AGENTS.md and .codex/TEAM.md.\nRun the exact assigned command; write only assigned outputs/logs, never product code, fixtures, tests, config or memory. Distinguish static/test/runtime/experiment/hardware evidence. Report the first concrete failure with bounded output; no automatic retries or environment repair. Long jobs use .ai/LONG_RUNNING_TASKS.md and an ETA-sized quiet wait, not repeated 30-minute checks. Exit 0 is not a training PASS.\nStay within the assigned authority. Use .ai/LONG_RUNNING_TASKS.md for durable waits; never hire a model to poll. Return a bounded result, evidence and unresolved claims.\n\n\n[V1.5.0 CHILD GUARD]\nNo child spawning, model/effort override, Git, external authority changes or full-history fork. Report to your Main, not the other team. Stop at your assigned boundary. Return exact evidence and unresolved claims; never run a model polling loop. These guards supersede older model/effort wording above. The deep_researcher is the sole Astra/medium identity per team and is reserved for the hardest mathematical/causal/complex question, not routine review.\n"

["agents"]
"enabled" = false

["features"]

["features"."context_management"]
"experimental_mode" = false

["features"."token_budget"]
"enabled" = false

# @package _global_
# base_v22 G1 — Wave 1 conditional posture, seed 0, physical GPU0.
#
# Wave 1 keeps the v21 door distribution: the hinge randomization mixture is a
# Wave 2 intervention and must not be confounded with the posture mechanism.
# Measured constants (P0-C nominal posture table, workspace lower tail, tracking
# baseline) are NOT written here; the formal launcher injects them from the frozen
# admission artifacts so there is exactly one source of truth for them.
scientific_plan_id: base_v22_posture_clearance_force_routing_v3
admission_plan_id: base_v22_execution_v3
v22_schema: a2_piper_base_v22_config_v1
v22_cell: G3
v22_wave: 2
v22_posture: conditional
v22_randomization: v22_H0_H4_frozen_by_P0_D
v22_body_assist: false
v22_formal_launchable: false
v22_promoted: false

checkpoint: logs_rl/a2_piper_full_stage_a2_base/base_v21B/formal/B1/model_step_000500.pt
checkpoint_load_mode: policy_only
auto_load_latest: false
seed: 0
num_envs: 4096
headless: true
algo:
  trl:
    num_total_batches: 2500
callbacks:
  model_save:
    save_frequency: 250
schedule_dict:
  "env@config@a2_v20_pre_send_crossing_mode":
    type: segment
    val_type: str
    seg_steps: [0, 500]
    seg_vals: [penalty, terminal]
    trigger_func: "env@on_a2_v20_R1_crossing_mode_transition"

env:
  config:
    # ---- v22 identity -------------------------------------------------------
    a2_v22_evidence_enabled: true
    a2_v22_cell: G3
    a2_v22_wave: 2
    a2_v22_posture_enabled: true
    a2_v22_posture_telemetry_only: false
    a2_v22_clearance_enabled: true
    a2_v22_body_assist_enabled: false
    a2_v22_formal_launch: false

    # ---- v22 hinge randomization mixture (Wave 2; H3/H4 unrealized per V22_HINGE_RANGE_FREEZE) ----
    a2_v22_hinge_bucket_mixture:
      - {bucket: H0, weight: 0.6471, damping: [50.0, 150.0], stiffness: [6.0, 20.0], max_force_nm: [10.0, 24.0], mass_kg: [80.0, 160.0], handle_height_m: [0.85, 1.10]}
      - {bucket: H1, weight: 0.1765, damping: [30.0, 120.0], stiffness: [2.0, 6.0], max_force_nm: [5.0, 12.0], mass_kg: [80.0, 160.0], handle_height_m: [0.85, 1.10]}
      - {bucket: H2, weight: 0.1765, damping: [15.0, 50.0], stiffness: [6.0, 20.0], max_force_nm: [10.0, 18.0], mass_kg: [80.0, 160.0], handle_height_m: [0.85, 1.10]}
    a2_v22_hinge_bucket_seed: 0
    a2_v22_hinge_bucket_table:
      - {bucket: H0, damping: [50.0, 150.0], stiffness: [6.0, 20.0], max_force_nm: [10.0, 24.0]}
      - {bucket: H1, damping: [30.0, 120.0], stiffness: [2.0, 6.0], max_force_nm: [5.0, 12.0]}
      - {bucket: H2, damping: [15.0, 50.0], stiffness: [6.0, 20.0], max_force_nm: [10.0, 18.0]}

    # ---- inherited v21-B / v20 runtime contract ------------------------------
    a2_v20_R2_evidence_enabled: true
    a2_v20_R2_group: G1
    a2_v20_R2_seed: 0
    a2_v20_R2_formal_launch: false
    a2_m39_gripper_material_enabled: true
    a2_door_weight_range: [80.0, 160.0]
    a2_corridor_enabled: true
    a2_corridor_door_wide_hinge_norm: 1.60
    a2_arm_dof_overspeed_soft_margin_enabled: true
    a2_arm_dof_overspeed_soft_margin_width: 0.5
    a2_door_body_contact_penalty_mode: event_v17
    a2_stage5_hold_income_continuity_enabled: true
    a2_door_body_contact_event_force_threshold: 5.0
    a2_door_body_contact_event_peak_force_norm: 200.0
    a2_door_body_contact_event_component_cap: 2.0
    a2_stage2_contact_force_threshold: 1.0
    a2_stage2_squeeze_force_min: 2.0
    a2_stage2_squeeze_force_max: 30.0
    a2_stage2_over_force_threshold: 55.0
    a2_grasp_gate_mode: control_streak
    a2_grasp_streak_control_steps: 5
    a2_stage3_to4_door_hinge_threshold: 0.25
    a2_stage3_to4_requires_grasp_streak: true
    a2_stage3_to4_streak_highwater: false
    a2_stage3_base_unlocked: true
    a2_stage3_unlatch_handle_position_norm: 0.6
    a2_stage3_unlatch_near_closed_hinge_threshold: 0.1
    a2_stage3_stage4_hold_and_drive_velocity_norm: 0.1
    a2_stage3_stage4_hold_and_drive_velocity_norm_in_corridor: 0.4
    a2_stage3_stage4_hold_and_drive_velocity_threshold: 0.05
    a2_stage3_stage4_coasting_velocity_threshold: 0.1
    a2_stage3_handle_hard_limit_position: 0.785398
    a2_stage3_handle_hard_limit_tolerance: 0.005
    a2_stage4_release_hinge_threshold: 1.60
    a2_stage4_to5_door_hinge_threshold: 1.25
    a2_stage45_door_frame_contact_scale: 0.2
    a2_stage35_door_panel_contact_scale: 0.0
    a2_stage0_staging_x_min: 0.50
    a2_stage0_staging_x_max: 0.80
    a2_stage0_staging_y_tol: 0.15
    a2_v20_send_latch_enabled: true
    a2_v20_send_hinge_threshold: 0.90
    a2_v20_send_hinge_tolerance: 0.05
    a2_v20_pre_send_root_x_margin: 0.03
    a2_v20_pre_send_crossing_mode: penalty
    a2_v20_pre_send_crossing_penalty_component: 1.0
    a2_v20_telemetry_enabled: true
    a2_v20_traversal_economics_enabled: true
    a2_v20_target_root_pre_send_scale: 0.0
    a2_v20_target_root_post_send_stage4_scale: 0.5
    a2_v20_target_root_ramp_width_rad: 0.20
    a2_v21B_target_root_ramp_theta_rad: 0.90
    a2_corridor_latch_mode: send_ready_v20
    a2_v20_arm_tie_enabled: false
    a2_v20_arm_tangent_carry_scale: 0.0
    a2_v20_handle_arc_tracking_scale: 0.0
    a2_v20_taskspace_activity_floor_mps: 0.005
    a2_v20_arc_position_tolerance_m: 0.03
    a2_v20_arc_orientation_tolerance_rad: 0.2
    a2_v20_calibration_label: base_v22_G1_posture_seed0
    a2_v20_R1_plan_id: base_v22_posture_clearance_force_routing_v3
    a2_v20_R1_send_curriculum_enabled: true
    a2_v20_R1_soft_phase_end_batch: 500
    a2_v20_R1_snapshot_guard_enabled: true
    a2_v20_R1_crossing_base_component: 1.0
    a2_v20_R1_crossing_shortfall_gain: 1.0
    a2_v20_formal_values_frozen: true
    a2_v20_formal_launch: false
    max_stage_time: [250, 100, 100, 100, 100, 200]
    award_remaining_time_on_advance: true
    reset_on_complete: true
    reset_on_overtime: true
robot:
  dof_effort_limit_list: [120.0, 120.0, 180.0, 120.0, 120.0, 180.0, 120.0, 120.0, 180.0, 120.0, 120.0, 180.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 45.0, 45.0]
  control:
    stiffness: {arm_j7: 1300.0, arm_j8: 1300.0}
    damping: {arm_j7: 32.0, arm_j8: 32.0}
rewards:
  reward_penalty_curriculum: false
  reward_scales:
    push_door_handle: 0.0
    push_door_hinge: 6.0
    push_door_force: 0.0
    a2_stage3_unlatch_hold: 3.0
    a2_stage3_stage4_hold_and_drive: 8.0
    a2_corridor_clean_passage: 1.0
    a2_stage3_stage4_keep_close_command: 0.5
    penalty_a2_stage3_stage4_open_command: -1.0
    a2_stage3_stage4_both_contact: 0.5
    a2_stage3_stage4_opposite_squeeze: 0.5
    a2_stage3_stage4_squeeze_force_window: 0.5
    a2_stage3_stage4_contact_stability: 0.5
    penalty_a2_stage3_stage4_over_force: -1.0
    penalty_a2_door_body_contact: -3.0
    # v21-B's unconditional posture L1 penalty is retired: v22 replaces it with the
    # conditional excess-posture term below.  Keeping both would penalise posture the
    # v22 mechanism has just decided is needed.
    penalty_a2_posture_command_l1: 0.0
    a2_corridor_door_wide: 4.2666667
    a2_v20_arm_tangent_carry: 0.0
    a2_v20_handle_arc_tracking: 0.0
    penalty_a2_v20_pre_send_crossing: -15.0
    # ---- v22 posture / clearance terms (plan §7.4, §8.6) --------------------
    penalty_a2_v22_excess_posture: -2.0
    penalty_a2_v22_posture_saturation: -16.0
    a2_v22_posture_feasibility: 0.5
    a2_v22_clearance_success: 4.0
    a2_v22_controlled_fling: 2.0
    penalty_a2_v22_unsafe_release: -8.0
simulator:
  config:
    render_results: false
    cameras: {enable_cameras: false}
    sim:
      physx: {num_velocity_iterations: 2}

# @package _global_
# H15: native full-policy learning from random initialization in the 50/50
# mirrored environment. The uninterrupted process preserves online reset banks
# while moving acquisition -> Stage3 -> Stage4/5 occupancy.

defaults:
  - /ablation/wbmanip/pull_lr_full_gate_a
  - _self_

checkpoint: null
checkpoint_load_mode: full
auto_load_latest: false
experiment_name: pull_lr_full_native_bilateral

algo:
  config:
    load_optimizer: false
    actor_learning_rate: 1.0e-4
    critic_learning_rate: 1.0e-4
    actor:
      _target_: gr00t.rl.trl.modules.pull_v6_native_bilateral_actor.PullV6NativeBilateralActor
      freeze_running_mean_std: false
  trl:
    num_total_batches: 1500

schedule_dict:
  "env@staged_reset_ratios@0":
    type: segment
    val_type: float
    seg_steps: [0, 250, 750, 1250]
    seg_vals: [0.50, 0.25, 0.25, 0.40]
  "env@staged_reset_ratios@1":
    type: segment
    val_type: float
    seg_steps: [0, 250, 750, 1250]
    seg_vals: [0.25, 0.0, 0.0, 0.0]
  "env@staged_reset_ratios@2":
    type: segment
    val_type: float
    seg_steps: [0, 250, 750, 1250]
    seg_vals: [0.25, 0.25, 0.10, 0.05]
  "env@staged_reset_ratios@3":
    type: segment
    val_type: float
    seg_steps: [0, 250, 750, 1250]
    seg_vals: [0.0, 0.50, 0.35, 0.15]
  "env@staged_reset_ratios@4":
    type: segment
    val_type: float
    seg_steps: [0, 250, 750, 1250]
    seg_vals: [0.0, 0.0, 0.25, 0.25]
  "env@staged_reset_ratios@5":
    type: segment
    val_type: float
    seg_steps: [0, 250, 750, 1250]
    seg_vals: [0.0, 0.0, 0.05, 0.15]

env:
  config:
    staged_reset_ratios: [0.50, 0.25, 0.25, 0.0, 0.0, 0.0]
    a2_pull_stage3_e3_snapshot_curriculum_enabled: false
    a2_pull_stage3_taskspace_action_enabled: false

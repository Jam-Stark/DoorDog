# @package _global_

checkpoint: ???
checkpoint_load_mode: full

# algo:
#   config:
#     network_load_dict:
#       teacher_actor:
#         path: ???

algo:
  config:
    eval:
      num_eval_episodes: 150  # number of episodes to evaluate per device; may be overridden by num_save_episodes
      save_videos: false  # whether to save videos
      video_save_prob: 1.0

      save_goal_reached_only: true  # whether to only save successful trajectories

      # The following two parameters are about saving trajectories
      save_trajectories: false
      num_save_episodes: 200  # number of episodes to save per device; will override num_eval_episodes

      # A2 eval-only causal diagnostics. The expanded step trace is opt-in;
      # forced close is additionally gated on the expanded trace for auditability.
      # Eval-only P2 posture discriminator. `none` preserves historical behavior;
      # `pitch_zero` and `roll_zero` clamp only the selected base command channel.
      a2_eval_p2_posture_axis: none
      # M41 strict exporter: require complete terminal rows and contiguous stage2 trace
      # coverage before any success artifact is written.
      a2_eval_m41_strict_telemetry: false
      # v20 strict exporter is opt-in and fail-fast when enabled.
      a2_eval_v20_strict_telemetry: false
      a2_diagnostic_trace_enabled: false
      a2_diagnostic_reward_terms:
        - gripper_handle_orientation
        - grasp_target_distance
        - grasp
        - penalty_not_standing_still
        - push_door_handle
        - push_door_hinge
        - dont_push_door_handle
        - target_root_distance
        - penalty_standing_still
        - stage
        - penalty_door_frame_contact
        - penalty_door_panel_contact
        - penalty_base_roll_pitch_l2
      a2_forced_gripper_close_enabled: false
      a2_forced_gripper_close_value: -1.0
      a2_forced_gripper_close_stages: [3, 4]
      # Formal-eval, first-episode-only deterministic hold oracle. The normal
      # policy path is bit-for-bit unchanged while this flag is false.
      a2_hold_oracle_enabled: false
      a2_pull_h10m_live_pose_probe_enabled: false
      a2_pull_h10m_hinge_target_rad: 0.105
      a2_pull_h10m_timeout_steps: 100
      a2_pull_h10m_joint_correction_step_max_rad: 0.05
      a2_pull_v6_p1_oracle_enabled: false
      a2_pull_v6_p1_orientation_axis: x
      a2_pull_v6_p1_target_hinge_velocity_radps: 0.30
      a2_pull_v6_p1_xy_relief_m: 0.05
      a2_pull_v6_p1_through_speed_mps: 0.20
      # P1 live-grasp circular-arc feasibility probe.  This is eval-only and
      # mutually exclusive with the legacy clamp/stabilization preflights.
      a2_v20_arc_probe_enabled: false
      a2_v20_arc_probe_mode: F0
      a2_v20_arc_probe_target_hinge_rad: 0.9
      a2_v20_arc_probe_timeout_steps: 1200
      a2_v20_arc_probe_lead_rad: 0.008
      a2_v20_arc_probe_max_orientation_step_rad: 0.02
      a2_v20_arc_probe_joint_target_step_max_rad: 0.001
      a2_v20_arc_probe_terminal_window_steps: 10
      a2_v20_arc_probe_orientation_tolerance_rad: 0.20
      a2_v20_arc_probe_relief_translation_max_m: 0.10
      a2_v20_arc_probe_relief_yaw_max_rad: 0.15
      a2_v20_arc_probe_handoff_root_speed_max_mps: 0.20
      a2_v20_arc_probe_handoff_root_yaw_rate_max_radps: 0.20
      # Stable post-physics handoff admission: exactly five qualifying steps.
      a2_v20_arc_probe_handoff_streak_steps: 5
      # F1 bounded relief protocol (translation/yaw residuals and yaw-rate map).
      a2_v20_arc_probe_relief_min_residual_m: 0.002
      a2_v20_arc_probe_relief_min_yaw_residual_rad: 0.002
      a2_v20_arc_probe_relief_yaw_gain: 5.0
      a2_v20_arc_probe_relief_yaw_speed_max_radps: 0.10
      a2_v20_arc_probe_root_hold_translation_gain: 10.0
      a2_v20_arc_probe_root_hold_translation_damping_gain: 2.0
      a2_v20_arc_probe_root_hold_translation_speed_max_mps: 0.50
      a2_v20_arc_probe_root_hold_yaw_gain: 40.0
      a2_v20_arc_probe_root_hold_yaw_damping_gain: 2.0
      a2_v20_arc_probe_root_hold_yaw_speed_max_radps: 1.00
      a2_v20_arc_probe_f1_root_hold_scale: 1.00
      # Pull-v0 P1 mechanics probe. This pull-plan-only branch inserts a
      # monotone proof-load phase before handle rotation and circular-arc follow.
      a2_pull_p1_probe_enabled: false
      a2_pull_p1_probe_mode: push_anchor
      a2_pull_p1_anchor_acquisition_enabled: false
      a2_pull_p1_proof_offset_m: 0.006
      a2_pull_p1_proof_ramp_steps: 30
      a2_pull_p1_proof_hold_steps: 10
      a2_pull_p1_body_contact_threshold_n: 1.0
      # Bounded high-level admission control for the push-anchor stage-0 band.
      a2_pull_p1_stage0_staging_speed_mps: 0.15
      a2_pull_p1_stage0_settle_steps: 5
      a2_pull_p1_stage0_timeout_steps: 120
      # Reset-boundary contact admission runs before any signed staging/DLS command.
      a2_pull_p1_reset_contact_qualification_steps: 3
      a2_pull_p1_reset_contact_qualification_streak_steps: 2
      a2_pull_p1_reset_upright_tolerance_rad: 0.35
      a2_pull_p1_reset_gripper_action: -1.0
      a2_hold_oracle_center_timeout_steps: 80
      a2_hold_oracle_center_position_tolerance_m: 0.005
      a2_hold_oracle_center_orientation_tolerance_rad: 0.10
      a2_hold_oracle_depress_timeout_steps: 100
      a2_hold_oracle_push_timeout_steps: 150
      a2_hold_oracle_depress_offset_m: 0.012
      a2_hold_oracle_push_offset_m: 0.012
      a2_hold_oracle_offset_ramp_steps: 20
      a2_hold_oracle_sign_smoke_steps: 10
      a2_hold_oracle_sign_min_delta: 0.005
      a2_hold_oracle_handle_target_rad: 0.50
      a2_hold_oracle_hinge_progress_target_rad: 0.20
      a2_hold_oracle_contact_slip_grace_steps: 5
      a2_hold_oracle_dls_lambda: 0.01
      a2_hold_oracle_max_position_step_m: 0.002
      a2_hold_oracle_max_orientation_step_rad: 0.02
      a2_hold_oracle_jacobian_condition_max: 1000000.0
      a2_hold_oracle_joint_limit_margin: 0.0001
      a2_hold_oracle_soft_limit_progress_tolerance: 0.000001
      a2_hold_oracle_raw_action_abs_max: 10.0
      # Eval-only deterministic base relief. Relief steps still consume the
      # current oracle phase timeout budget.
      a2_hold_oracle_base_relief_speed_mps: 0.15
      a2_hold_oracle_base_relief_sign_window_steps: 20
      a2_hold_oracle_base_relief_min_residual_decrease_m: 0.001
      a2_hold_oracle_base_relief_timeout_steps: 60
      a2_hold_oracle_base_relief_max_displacement_m: 0.10
      a2_hold_oracle_base_relief_min_solvable_horizontal_error_m: 0.002
      # Eval-only anti-backdrive probe. When enabled, the oracle snapshots the
      # close-gate gripper gains, writes these static gains for exactly the
      # configured number of physics actions, then restores the snapshot.
      a2_hold_oracle_static_clamp_enabled: false
      a2_hold_oracle_static_clamp_steps: 40
      a2_hold_oracle_static_clamp_stiffness: 80.0
      a2_hold_oracle_static_clamp_damping: 3.0
      a2_hold_oracle_static_clamp_offset_probe_enabled: false
      a2_hold_oracle_static_clamp_offset_m: 0.0
      a2_hold_oracle_static_clamp_offset_placement_steps: 20
      a2_hold_oracle_static_clamp_offset_position_tolerance_m: 0.0005
      a2_hold_oracle_static_clamp_offset_orientation_tolerance_rad: 0.02
      a2_hold_oracle_open_stabilization_preflight_enabled: false
      a2_hold_oracle_open_stabilization_steps: 40
      a2_hold_oracle_open_stabilization_quiet_window_steps: 5
      a2_hold_oracle_open_stabilization_root_linear_speed_max_mps: 0.01
      a2_hold_oracle_open_stabilization_root_angular_speed_max_radps: 0.02
      a2_hold_oracle_open_stabilization_pose_per_call_translation_max_m: 0.0005
      a2_hold_oracle_open_stabilization_pose_per_call_rotation_max_rad: 0.0005
      a2_hold_oracle_open_stabilization_pose_window_translation_max_m: 0.001
      a2_hold_oracle_open_stabilization_pose_window_rotation_max_rad: 0.002
      a2_hold_oracle_open_stabilization_contact_force_max_n: 1.0
      # Eval-only matched clean reacquisition / stabilize-before-capture Phase-0.
      # Mutually exclusive with static clamp, offset probe, and old open stabilization.
      a2_hold_oracle_matched_clean_reacquisition_preflight_enabled: false
      a2_hold_oracle_matched_clean_retreat_timeout_steps: 80
      a2_hold_oracle_matched_clean_release_qualification_steps: 5
      a2_hold_oracle_matched_clean_pregrasp_position_tolerance_m: 0.005
      a2_hold_oracle_matched_clean_pregrasp_orientation_tolerance_rad: 0.10
      

eval_timestamp: ${now:%Y%m%d_%H%M%S}
eval_name: TEST
eval_base_dir: logs_eval
eval_output_dir: ${eval_base_dir}/${eval_timestamp}-${eval_name}
eval_log_dir: ${eval_output_dir}
env:
  config:
    save_rendering_dir: ${eval_output_dir}/renderings
hydra:
  run:
    dir: ${eval_log_dir}

# @package _global_

# Phase 2 A2+Piper Student Distillation route.  Teacher artifacts are
# intentionally unresolved until a frozen A2 Teacher PPO checkpoint has been
# reviewed and its manifest generated.
defaults:
  - /algo: dagger_vision_distributed
  - /env: door_open_a2_base
  - /simulator: isaacsim
  - /domain_rand: domain_rand_visual_ImageRand
  - /rewards: wbmanip/reward_door_open_a2_base
  - /robot: A2_Piper/a2_piper
  - /terrain: terrain_locomotion_plane
  - /obs: wbmanip/door_open_a2_base_dagger
  - /opt: wandb
  - override /trainer: trl_distill_a2_base_api

exp_base: ${hydra:runtime.choices.exp}
exp_var: lstm
experiment_name: ${exp_base}_${exp_var}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}-${timestamp}

num_envs: 4096
project_name: a2_piper_open_door_student_distill
headless: True
enable_cameras: True

# Fixed-camera / Teacher-controlled cold start.  Decrease ratio_teacher_rollout
# manually between reviewed runs; there is no automatic annealing in this route.
domain_rand:
  image_augmentation:
    enabled: False

# Required, immutable-by-policy artifact paths.  Replace all three with a
# reviewed artifact set; the trainer and standalone validator fail fast while
# any path remains unresolved.  A mutable `last.pt` is rejected.
teacher_actor_path: REQUIRED_A2_TEACHER_CHECKPOINT.pt
teacher_config_path: REQUIRED_A2_TEACHER_CONFIG.yaml
teacher_manifest_path: REQUIRED_A2_TEACHER_MANIFEST.json

callbacks:
  model_save:
    # Production cadence remains 500. One-update smoke launches must override
    # this explicitly with callbacks.model_save.save_frequency=1.
    save_frequency: 500

algo:
  config:
    use_new_actor_critic: True
    use_dagger: True
    distill_only: False
    num_steps_per_env: 8
    num_learning_epochs: 1
    num_mini_batches: 4
    use_padding_mask: False
    ppo_shuffle_every_epoch: True
    sync_advantage_normalization: True
    actor_learning_rate: 1.0e-4
    critic_learning_rate: 1.0e-4
    dagger_bc_loss_type: l2
    dagger_bc_loss_coef: 1.0
    compute_dagger_bc_loss_w_imgaug: False
    train_with_evaluating_env: False
    enforce_teacher_rollout: True
    ratio_teacher_rollout: 1.0

    # Exactly 12 learned high-level actions.  The A2_Base leg policy is frozen
    # and appended only at the environment boundary by the A2 distill trainer.
    student_action_dim: 12
    teacher_action_dim: 12
    rollout_action_dim: 24
    teacher_obs_dim: 133
    critic_obs_dim: 138
    a2_base_obs_dim: 1620
    a2_base_action_dim: 12

    use_a2_base: True
    a2_base:
      enabled: True
      policy_path: ./gr00t/rl/data/policies/A2_Base/policy.pt
      metadata_path: ./gr00t/rl/data/policies/A2_Base/policy_metadata.json
      obs_dim: 1620
      action_dim: 12
      command_scale: 0.25
      command_multipliers: [2.0, 2.0, 0.25, 1.0, 1.0]
      body_pitch_roll_scale: 0.4

    network_load_dict:
      teacher_actor:
        path: ${teacher_actor_path}

    teacher_artifact:
      checkpoint_path: ${teacher_actor_path}
      config_path: ${teacher_config_path}
      manifest_path: ${teacher_manifest_path}

    # Object prediction is a later validated-frame extension.  It is disabled
    # here so no stale object target enters the deployed student contract.
    use_obj_pred: False
    obj_pred_loss_coef: 0.0

    init_noise_std: 0.001
    max_noise_std: 0.001
    clamp_noise_std: True
    freeze_noise_std: False
    gamma: 0.9966
    lam: 0.983
    desired_kl: 0.005
    init_at_random_ep_len: True

    module_dim:
      # Recurrent modules overwrite these predeclared substitution slots with
      # their RNN hidden size; keep the mapping structured at composition time.
      actor_obs: -1
      teacher_obs: -1
      critic_obs: -1
      vision_feature_dim: 128

    actor:
      _target_: gr00t.rl.trl.modules.vision_actor_critic_modules_recurrent.VisionRecurrentActor
      input_key: actor_obs
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      backbone:
        vision_module:
          _target_: gr00t.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [vision_obs]
            output_dim: ["${algo.config.module_dim.vision_feature_dim}"]
            layer_config:
              type: ResNet
              resnet_type: resnet18
              pretrained: True
              trainable: True
        mlp_module:
          _target_: gr00t.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [actor_obs]
            output_dim: ["${algo.config.student_action_dim}"]
            layer_config:
              type: MLP
              hidden_dims: [512, 256, 128]
              activation: SiLU

    teacher_actor:
      _target_: gr00t.rl.trl.modules.actor_critic_modules_recurrent.RecurrentActor
      input_key: teacher_obs
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      backbone:
        _target_: gr00t.rl.agents.modules.modules.BaseModule
        process_output_dim: True
        module_config_dict:
          input_dim: [teacher_obs]
          output_dim: ["${algo.config.teacher_action_dim}"]
          layer_config:
            type: MLP
            hidden_dims: [512, 256, 128]
            activation: SiLU

    critic:
      _target_: gr00t.rl.trl.modules.actor_critic_modules_recurrent.RecurrentCritic
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      backbone:
        _target_: gr00t.rl.agents.modules.modules.BaseModule
        process_output_dim: True
        module_config_dict:
          input_dim: [critic_obs]
          output_dim: [1]
          layer_config:
            type: MLP
            hidden_dims: [512, 256, 128]
            activation: SiLU

simulator:
  config:
    randomize_dome_light: False
    cameras:
      enable_cameras: True
      camera_parent: trunk
      camera_prim_suffix: ego_camera
      camera_pos: [0.25, 0.0, 0.14]
      camera_rot_wxyz: [0.315631686, 0.134503192, -0.390177116, -0.854428083]
      camera_convention: world
      camera_focal_length: 1.88
      camera_focus_distance: 0.5
      camera_horizontal_aperture: 2.6035
      camera_vertical_aperture: 1.4621
      camera_clipping_range: [0.1, 20.0]
      camera_update_period: 0.0
      camera_types:
        - rgb: True
        - depth: False
      camera_resolutions: [216, 384]
      eval_camera_resolutions: [720, 1280]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
    scene:
      replicate_physics: False
      env_spacing: 20.0
    sim:
      physx:
        num_position_iterations: 4
        num_velocity_iterations: 1
        max_depenetration_velocity: 300.0

robot:
  asset:
    self_collisions: 0
  use_primitive: False
  actions_dim: 20
  check_action_dim: True
  terminate_after_contacts_on: []

env:
  config:
    reset_from_dataset:
      enabled: False

# @package _global_

# A2+Piper C-B Student Distillation route for the sealed base_v16_B Teacher.
# The launcher must overlay the exact v16 task modules from source commit
# 815b367f5de2a52b26a4b872d0457af8817d01bd.
defaults:
  - /algo: dagger_vision_distributed
  - /env: door_open_a2_base
  - /simulator: isaacsim
  - /domain_rand: domain_rand_visual_ImageRand
  - /rewards: wbmanip/reward_door_open_a2_base
  - /robot: A2_Piper/a2_piper
  - /terrain: terrain_locomotion_plane
  - /obs: wbmanip/door_open_a2_base_dagger
  - /opt: wandb
  - override /trainer: trl_distill_a2_base_api

exp_base: ${hydra:runtime.choices.exp}
exp_var: v16_cb_lstm
experiment_name: ${exp_base}_${exp_var}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}-${timestamp}

num_envs: 4096
project_name: a2_piper_open_door_v16_cb_student_distill
headless: True
enable_cameras: True

# Fixed-camera / Teacher-controlled cold start.  Decrease ratio_teacher_rollout
# manually between reviewed runs; there is no automatic annealing in this route.
domain_rand:
  image_augmentation:
    enabled: False

# Required, immutable-by-policy artifact paths.  Replace all three with a
# reviewed artifact set; the trainer and standalone validator fail fast while
# any path remains unresolved.  A mutable `last.pt` is rejected.
teacher_actor_path: REQUIRED_A2_V16_B_TEACHER_CHECKPOINT.pt
teacher_config_path: REQUIRED_A2_V16_B_TEACHER_CONFIG.yaml
teacher_manifest_path: REQUIRED_A2_V16_B_TEACHER_MANIFEST.json

callbacks:
  model_save:
    # Production cadence remains 500. One-update smoke launches must override
    # this explicitly with callbacks.model_save.save_frequency=1.
    save_frequency: 500

algo:
  config:
    use_new_actor_critic: True
    use_dagger: True
    distill_only: False
    num_steps_per_env: 8
    num_learning_epochs: 1
    num_mini_batches: 4
    use_padding_mask: False
    ppo_shuffle_every_epoch: True
    sync_advantage_normalization: True
    actor_learning_rate: 1.0e-4
    critic_learning_rate: 1.0e-4
    dagger_bc_loss_type: l2
    dagger_bc_loss_coef: 1.0
    compute_dagger_bc_loss_w_imgaug: False
    train_with_evaluating_env: False
    enforce_teacher_rollout: True
    ratio_teacher_rollout: 1.0

    # Exactly 12 learned high-level actions.  The A2_Base leg policy is frozen
    # and appended only at the environment boundary by the A2 distill trainer.
    student_action_dim: 12
    teacher_action_dim: 12
    rollout_action_dim: 24
    teacher_obs_dim: 133
    critic_obs_dim: 138
    a2_base_obs_dim: 1620
    a2_base_action_dim: 12

    use_a2_base: True
    a2_base:
      enabled: True
      policy_path: ./gr00t/rl/data/policies/A2_Base/policy.pt
      metadata_path: ./gr00t/rl/data/policies/A2_Base/policy_metadata.json
      obs_dim: 1620
      action_dim: 12
      command_scale: 0.25
      command_multipliers: [2.0, 2.0, 0.25, 1.0, 1.0]
      body_pitch_roll_scale: 0.4

    network_load_dict:
      teacher_actor:
        path: ${teacher_actor_path}

    teacher_artifact:
      checkpoint_path: ${teacher_actor_path}
      config_path: ${teacher_config_path}
      manifest_path: ${teacher_manifest_path}

    # Object prediction is a later validated-frame extension.  It is disabled
    # here so no stale object target enters the deployed student contract.
    use_obj_pred: False
    obj_pred_loss_coef: 0.0

    init_noise_std: 0.001
    max_noise_std: 0.001
    clamp_noise_std: True
    freeze_noise_std: False
    gamma: 0.9966
    lam: 0.983
    desired_kl: 0.005
    init_at_random_ep_len: False

    module_dim:
      # Recurrent modules overwrite these predeclared substitution slots with
      # their RNN hidden size; keep the mapping structured at composition time.
      actor_obs: -1
      teacher_obs: -1
      critic_obs: -1
      vision_feature_dim: 128

    actor:
      _target_: gr00t.rl.trl.modules.vision_actor_critic_modules_recurrent.VisionRecurrentActor
      input_key: actor_obs
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      backbone:
        vision_module:
          _target_: gr00t.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [vision_obs]
            output_dim: ["${algo.config.module_dim.vision_feature_dim}"]
            layer_config:
              type: ResNet
              resnet_type: resnet18
              pretrained: True
              trainable: True
        mlp_module:
          _target_: gr00t.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [actor_obs]
            output_dim: ["${algo.config.student_action_dim}"]
            layer_config:
              type: MLP
              hidden_dims: [512, 256, 128]
              activation: SiLU

    teacher_actor:
      _target_: gr00t.rl.trl.modules.actor_critic_modules_recurrent.RecurrentActor
      input_key: teacher_obs
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      backbone:
        _target_: gr00t.rl.agents.modules.modules.BaseModule
        process_output_dim: True
        module_config_dict:
          input_dim: [teacher_obs]
          output_dim: ["${algo.config.teacher_action_dim}"]
          layer_config:
            type: MLP
            hidden_dims: [512, 256, 128]
            activation: SiLU

    critic:
      _target_: gr00t.rl.trl.modules.actor_critic_modules_recurrent.RecurrentCritic
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      backbone:
        _target_: gr00t.rl.agents.modules.modules.BaseModule
        process_output_dim: True
        module_config_dict:
          input_dim: [critic_obs]
          output_dim: [1]
          layer_config:
            type: MLP
            hidden_dims: [512, 256, 128]
            activation: SiLU

simulator:
  config:
    randomize_dome_light: False
    cameras:
      enable_cameras: True
      # Current committed C-B primary view: low-profile centered landscape D435i, up 60 deg.
      camera_parent: trunk
      camera_prim_suffix: d435i_landscape_camera
      camera_pos: [0.26, 0.0, 0.215]
      camera_rot_wxyz: [0.8660254037844386, 0.0, -0.5, 0.0]
      camera_convention: world
      camera_focal_length: 1.0
      camera_focus_distance: 0.5
      camera_horizontal_aperture: 1.3745619172032262
      camera_vertical_aperture: 0.7731910784268148
      camera_clipping_range: [0.1, 20.0]
      camera_update_period: 0.0
      camera_types:
        - rgb: True
        - depth: False
      # This is the composed policy tensor resolution, not the primary sensor resolution.
      camera_resolutions: [216, 768]
      eval_camera_resolutions: [720, 1280]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      policy_multiview:
        enabled: True
        architecture_id: C-B
        layout: horizontal_primary_then_letterboxed_secondary
        primary_resolution: [216, 384]
        output_resolution: [216, 768]
        secondary:
          sensor_name: a2_head_context
          parent: trunk
          prim_suffix: a2_head_context_camera
          position_m: [0.32, 0.0, 0.25]
          rotation_wxyz: [0.9945218953682733, 0.0, -0.10452846326765347, 0.0]
          convention: world
          resolution: [136, 384]
          focal_length: 1.0
          focus_distance: 0.5
          horizontal_aperture: 4.492073547808433
          vertical_aperture: 1.59094271484882
          clipping_range: [0.1, 20.0]
          update_period: 0.0
    scene:
      replicate_physics: False
      env_spacing: 20.0
    sim:
      physx:
        num_position_iterations: 4
        num_velocity_iterations: 1
        max_depenetration_velocity: 300.0

robot:
  asset:
    self_collisions: 0
  use_primitive: False
  actions_dim: 20
  check_action_dim: True
  terminate_after_contacts_on: []

env:
  config:
    # Exact base_v16_B_m29_m32_mass80_160 resolved task overrides.
    a2_stage0_staging_x_min: 0.5
    a2_stage0_staging_x_max: 0.8
    a2_stage0_staging_y_tol: 0.15
    a2_stage3_to4_requires_grasp_streak: True
    a2_stage3_to4_streak_highwater: False
    a2_corridor_enabled: True
    a2_stage3_stage4_hold_and_drive_velocity_norm_in_corridor: 0.4
    a2_door_body_contact_penalty_mode: quadratic_v16
    a2_stage2_squeeze_force_min: 2.0
    a2_stage3_to4_door_hinge_threshold: 0.25
    a2_stage3_base_unlocked: True
    a2_stage4_release_hinge_threshold: 1.04
    a2_stage35_door_panel_contact_scale: 0.0
    reset_from_dataset:
      enabled: False

rewards:
  reward_scales:
    push_door_handle: 0.0
    a2_stage3_unlatch_hold: 3.0
    a2_stage3_stage4_hold_and_drive: 8.0
    a2_corridor_door_wide: 2.0
    penalty_a2_door_body_contact: -2.0
    penalty_a2_posture_command_l1: -0.15

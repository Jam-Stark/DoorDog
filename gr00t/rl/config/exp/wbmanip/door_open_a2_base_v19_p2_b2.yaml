# @package _global_
# C-B2H-Pro P2 B2: exact B1 common core plus Head/context ablation branch.
defaults:
  - /algo: dagger_vision_distributed
  - /env: door_open_a2_base
  - /simulator: isaacsim
  - /domain_rand: domain_rand_visual_ImageRand
  - /rewards: wbmanip/reward_door_open_a2_base
  - /robot: A2_Piper/a2_piper
  - /terrain: terrain_locomotion_plane
  - /obs: wbmanip/door_open_a2_base_dagger_triview
  - /opt: wandb
  - override /trainer: trl_distill_a2_base_api

exp_base: cb2h_pro_p2
exp_var: v19_p2_b2
experiment_name: cb2h_pro_p2_v19_b2
project_name: a2_piper_open_door_cb2h_pro_p2_b2
num_envs: 64
headless: True
enable_cameras: True
domain_rand:
  image_augmentation: {enabled: False}
teacher_actor_path: REQUIRED_A2_V19_TEACHER_CHECKPOINT.pt
teacher_config_path: REQUIRED_A2_V19_TEACHER_CONFIG.yaml
teacher_manifest_path: REQUIRED_A2_V19_TEACHER_MANIFEST.json
callbacks:
  model_save: {save_frequency: 500}

algo:
  trl: {num_total_batches: 500}
  config:
    use_new_actor_critic: True
    use_dagger: True
    distill_only: False
    num_steps_per_env: 8
    num_learning_epochs: 1
    num_mini_batches: 4
    use_padding_mask: False
    ppo_shuffle_every_epoch: True
    sync_advantage_normalization: True
    actor_learning_rate: 1.0e-4
    critic_learning_rate: 1.0e-4
    dagger_bc_loss_type: l2
    dagger_bc_loss_coef: 1.0
    compute_dagger_bc_loss_w_imgaug: False
    train_with_evaluating_env: False
    enforce_teacher_rollout: True
    ratio_teacher_rollout: 1.0
    student_action_dim: 12
    teacher_action_dim: 12
    rollout_action_dim: 24
    teacher_obs_dim: 133
    critic_obs_dim: 138
    a2_base_obs_dim: 1620
    a2_base_action_dim: 12
    use_a2_base: True
    a2_base:
      enabled: True
      policy_path: ./gr00t/rl/data/policies/A2_Base/policy.pt
      metadata_path: ./gr00t/rl/data/policies/A2_Base/policy_metadata.json
      obs_dim: 1620
      action_dim: 12
    teacher_artifact:
      checkpoint_path: ${teacher_actor_path}
      config_path: ${teacher_config_path}
      manifest_path: ${teacher_manifest_path}
    p2_common_init:
      enabled: True
      branch: b2
      mode: load
      architecture: C-B2H-DUALRAW-SHAREDENC-TOEIN20-V19-P2
      seed: 0
      config_sha256: 9b3121b2d92b79237d0a871b5ff96eab8d4e32165627075170dafe7a3c6e4cfa
      artifact_path: ${experiment_dir}/common_init/b1_common_init.pt
      step0_manifest_path: ${experiment_dir}/common_init/b2_step0_manifest.json
      source_step0_manifest_path: ${experiment_dir}/common_init/b1_step0_manifest.json
      trusted_artifact_sha256: REQUIRED_AFTER_B1_STEP0_SEAL
      trusted_source_step0_manifest_sha256: REQUIRED_AFTER_B1_STEP0_SEAL
      runtime_identity: {runtime_repository: /tmp/cb2h_v19_runtime.waPJHftX/c18, runtime_commit: c18aea8bdc1c76ce850b5223663d0ad8a7474c0a}
    init_noise_std: 0.001
    max_noise_std: 0.001
    clamp_noise_std: True
    freeze_noise_std: False
    gamma: 0.9966
    lam: 0.983
    desired_kl: 0.005
    init_at_random_ep_len: False
    use_obj_pred: False
    obj_pred_loss_coef: 0.0
    p2_lifecycle:
      enabled: True
      target_global_step: 500
    module_dim: {actor_obs: -1, teacher_obs: -1, critic_obs: -1, vision_feature_dim: 128}
    actor:
      _target_: gr00t.rl.trl.modules.vision_actor_critic_modules_p2_recurrent.DualD435HeadVisionRecurrentActor
      input_key: actor_obs
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      view_contract:
        camera_meta_dim: 6
        d435i_forward_mode: packed
      backbone:
        d435i_vision_module:
          _target_: gr00t.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [vision_obs]
            output_dim: [128]
            layer_config: {type: ResNet, resnet_type: resnet18, pretrained: True, trainable: True}
        head_vision_module:
          _target_: gr00t.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [context_vision_obs]
            output_dim: [128]
            layer_config: {type: ResNet, resnet_type: resnet18, pretrained: True, trainable: True}
        mlp_module:
          _target_: gr00t.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [actor_obs]
            output_dim: [12]
            layer_config: {type: MLP, hidden_dims: [512, 256, 128], activation: SiLU}
    teacher_actor:
      _target_: gr00t.rl.trl.modules.actor_critic_modules_recurrent.RecurrentActor
      input_key: teacher_obs
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      backbone:
        _target_: gr00t.rl.agents.modules.modules.BaseModule
        process_output_dim: True
        module_config_dict:
          input_dim: [teacher_obs]
          output_dim: [12]
          layer_config: {type: MLP, hidden_dims: [512, 256, 128], activation: SiLU}
    critic:
      _target_: gr00t.rl.trl.modules.actor_critic_modules_recurrent.RecurrentCritic
      running_mean_std: True
      rnn_type: lstm
      rnn_hidden_dim: 256
      rnn_num_layers: 2
      backbone:
        _target_: gr00t.rl.agents.modules.modules.BaseModule
        process_output_dim: True
        module_config_dict:
          input_dim: [critic_obs]
          output_dim: [1]
          layer_config: {type: MLP, hidden_dims: [512, 256, 128], activation: SiLU}

env:
  config:
    a2_m39_gripper_material_enabled: True
    a2_door_weight_range: [80.0, 160.0]
    a2_corridor_enabled: True
    a2_corridor_door_wide_hinge_norm: 1.5
    a2_arm_dof_overspeed_soft_margin_enabled: True
    a2_arm_dof_overspeed_soft_margin_width: 0.5
    a2_door_body_contact_penalty_mode: event_v17
    a2_stage5_hold_income_continuity_enabled: True
    a2_door_body_contact_event_force_threshold: 5.0
    a2_door_body_contact_event_peak_force_norm: 200.0
    a2_door_body_contact_event_component_cap: 2.0
    a2_stage2_contact_force_threshold: 1.0
    a2_stage2_squeeze_force_min: 2.0
    a2_stage2_squeeze_force_max: 30.0
    a2_stage2_over_force_threshold: 55.0
    a2_grasp_gate_mode: control_streak
    a2_grasp_streak_control_steps: 5
    a2_stage3_to4_door_hinge_threshold: 0.25
    a2_stage3_to4_requires_grasp_streak: True
    a2_stage3_to4_streak_highwater: False
    a2_stage3_base_unlocked: True
    a2_stage3_unlatch_handle_position_norm: 0.6
    a2_stage3_unlatch_near_closed_hinge_threshold: 0.1
    a2_stage3_stage4_hold_and_drive_velocity_norm: 0.1
    a2_stage3_stage4_hold_and_drive_velocity_norm_in_corridor: 0.4
    a2_stage3_stage4_hold_and_drive_velocity_threshold: 0.05
    a2_stage3_stage4_coasting_velocity_threshold: 0.1
    a2_stage3_handle_hard_limit_position: 0.785398
    a2_stage3_handle_hard_limit_tolerance: 0.005
    a2_stage4_release_hinge_threshold: 1.60
    a2_stage4_to5_door_hinge_threshold: 1.25
    a2_stage45_door_frame_contact_scale: 0.2
    a2_stage35_door_panel_contact_scale: 0.0
    a2_stage0_staging_x_min: 0.50
    a2_stage0_staging_x_max: 0.80
    a2_stage0_staging_y_tol: 0.15
    reset_from_dataset: {enabled: False}
rewards:
  reward_penalty_curriculum: False
  reward_initial_penalty_scale: 1.0
  reward_min_penalty_scale: 1.0
  reward_max_penalty_scale: 1.0
  reward_penalty_degree: 0.0
  reward_scales:
    push_door_handle: 0.0
    push_door_hinge: 6.0
    push_door_force: 0.0
    a2_stage3_unlatch_hold: 3.0
    a2_stage3_stage4_hold_and_drive: 8.0
    a2_corridor_door_wide: 4.0
    a2_corridor_clean_passage: 1.0
    a2_stage3_stage4_keep_close_command: 0.5
    penalty_a2_stage3_stage4_open_command: -1.0
    a2_stage3_stage4_both_contact: 0.5
    a2_stage3_stage4_opposite_squeeze: 0.5
    a2_stage3_stage4_squeeze_force_window: 0.5
    a2_stage3_stage4_contact_stability: 0.5
    penalty_a2_stage3_stage4_over_force: -1.0
    penalty_a2_door_body_contact: -3.0
    penalty_a2_posture_command_l1: -0.3

simulator:
  config:
    randomize_dome_light: False
    cameras:
      enable_cameras: True
      architecture_id: C-B2H-DUALRAW-SHAREDENC-TOEIN20-V19-P2
      camera_parent: trunk
      camera_prim_suffix: d435i_left_portrait_policy_camera
      camera_pos: [0.215, 0.095, 0.165]
      camera_rot_wxyz: [0.852868532, -0.086824089, -0.492403877, -0.150383733]
      camera_convention: world
      camera_focal_length: 1.0
      camera_focus_distance: 0.5
      camera_horizontal_aperture: 0.7777574637059793
      camera_vertical_aperture: 1.3826799354772965
      camera_clipping_range: [0.1, 20.0]
      camera_update_period: 0.03333333333333333
      camera_types: [{rgb: True}]
      camera_resolutions: [384, 216]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      policy_multiview:
        enabled: True
        architecture_id: C-B2H-DUALRAW-SHAREDENC-TOEIN20-V19-P2
        layout: channel_stacked_raw_rgb
        primary_resolution: [384, 216]
        output_resolution: [384, 216]
        output_shape: [384, 216, 6]
        view_order: [left, right]
        right:
          sensor_name: d435i_right_portrait_policy
          parent: trunk
          prim_suffix: d435i_right_portrait_policy_camera
          position_m: [0.215, -0.095, 0.165]
          rotation_wxyz: [0.852868532, 0.086824089, -0.492403877, 0.150383733]
          convention: world
          resolution: [384, 216]
          focal_length: 1.0
          focus_distance: 0.5
          horizontal_aperture: 0.7777574637059793
          vertical_aperture: 1.3826799354772965
          clipping_range: [0.1, 20.0]
          update_period: 0.03333333333333333
        context:
          sensor_name: a2_head_oem_policy
          parent: trunk
          prim_suffix: a2_head_oem_policy_camera
          position_m: [0.3381, 0.0336, 0.0525]
          rotation_wxyz: [1.0, 0.0, 0.0, 0.0]
          convention: world
          resolution: [136, 384]
          focal_length: 1.0
          focus_distance: 0.5
          horizontal_aperture: 4.492073547808433
          vertical_aperture: 1.59094271484882
          clipping_range: [0.1, 20.0]
          update_period: 0.06666666666666667
        camera_meta:
          enabled: True
          order: [left_age_normalized, right_age_normalized, head_age_normalized, left_valid, right_valid, head_valid]
    scene: {replicate_physics: False, env_spacing: 20.0}
    sim:
      physx: {num_position_iterations: 4, num_velocity_iterations: 2, max_depenetration_velocity: 300.0}

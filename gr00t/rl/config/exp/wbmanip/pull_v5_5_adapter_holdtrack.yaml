# @package _global_

defaults:
  - /algo: ppo
  - /env: pull_v5_5_adapter_holdtrack
  - /simulator: isaacsim
  - /domain_rand: NO_domain_rand
  - /rewards: wbmanip/reward_pull_v5_5_adapter_holdtrack
  - /robot: A2_Piper/a2_piper
  - /terrain: terrain_locomotion_plane
  - /obs: wbmanip/pull_v5_5_adapter_holdtrack
  - /opt: wandb
  - override /trainer: trl_pull_v5_5_adapter

exp_base: ${hydra:runtime.choices.exp}
exp_var: adapter
experiment_name: pull_v5_5_adapter_holdtrack
project_name: a2_piper_pull_v5_5_adapter
num_envs: 256

algo:
  trl:
    num_total_batches: 750
  config:
    use_new_actor_critic: true
    use_a2_base: true
    a2_base:
      enabled: true
      policy_path: ./gr00t/rl/data/policies/A2_Base/policy.pt
      metadata_path: ./gr00t/rl/data/policies/A2_Base/policy_metadata.json
      obs_dim: 1620
      action_dim: 12
      leg_action_scale: 0.25
      command_scale: 0.25
      body_pitch_roll_scale: 0.4
      command_obs_multipliers: [2.0, 2.0, 0.25, 1.0, 1.0]
      action_sigma: 0.0
    num_steps_per_env: 64
    num_learning_epochs: 5
    num_mini_batches: 4
    actor_learning_rate: 1.0e-3
    critic_learning_rate: 1.0e-3
    entropy_coef: 0.01
    num_learning_iterations: 750
    save_interval: 250
    load_optimizer: false
    init_noise_std: 0.6
    max_noise_std: 0.6
    freeze_noise_std: false
    adapter_from_scratch: true
    adapter_trainable_action_dim: 3
    actor:
      _target_: gr00t.rl.trl.modules.pull_v5_5_adapter_actor.PullV55AdapterActor
      obs_dim: 12
      num_actions: 12
      hidden_dims: [128, 64]
      action_low: [-0.30, 0.0, -2.0]
      action_high: [0.0, 0.24, 2.0]
    critic:
      _target_: gr00t.rl.trl.modules.pull_v5_5_adapter_actor.PullV55AdapterCritic
      obs_dim: 12
      hidden_dims: [128, 64]

robot:
  actions_dim: 20
  check_action_dim: true

callbacks:
  model_save:
    save_frequency: 250

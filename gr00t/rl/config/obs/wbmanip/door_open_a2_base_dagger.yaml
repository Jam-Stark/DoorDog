# @package _global_

# A2+Piper Phase 2 observation contract.  Lists are intentionally ordered;
# `pre_process_config` preserves this order when flattening each public view.
obs:
  obs_dict:
    # Deployable student actor: 3 + 3 + 20 + 20 + 19 + 6 + 5 + 5 = 81D.
    actor_obs:
      - base_ang_vel
      - projected_gravity
      - a2_student_dof_pos
      - a2_student_dof_vel
      - actions
      - delta_actions
      - a2_base_command
      - a2_base_command_raw

    vision_obs:
      - rgb_image

    # Privileged A2 Teacher PPO actor input: exact active A2 term order = 133D.
    teacher_obs:
      - dof_pos
      - relative_to_door
      - dof_vel
      - actions
      - projected_gravity
      - door_dof_pos
      - base_lin_vel
      - base_ang_vel
      - hand_force
      - stage
      - privileged_door_info
      - delta_actions
      - gripper_handle_transform
      - a2_base_command_raw
      - a2_base_command

    # The PPO machinery only needs critic_obs when a critic is instantiated.
    # It is deliberately kept privileged and separate from actor_obs.
    critic_obs:
      - dof_pos
      - relative_to_door
      - dof_vel
      - actions
      - projected_gravity
      - door_dof_pos
      - base_lin_vel
      - base_ang_vel
      - hand_force
      - stage
      - privileged_door_info
      - delta_actions
      - gripper_handle_transform
      - a2_base_command_raw
      - transition
      - complete
      - time_in_stage
      - actual_time_in_stage
      - total_time
      - a2_base_command

    # Frozen A2_Base consumes this 30-frame x 54D contract only.
    a2_base_obs:
      - a2_base_obs

  # Keep this key because A2_Base initializes its history buffers from the
  # canonical observation route; it is not exposed as a student observation.
  homie_history_length: 5

  # The shared config preprocessor always routes compound observations through
  # this mapping.  A2+Piper exposes only direct terms, so no auxiliary history
  # compound is permitted on this route.
  obs_auxiliary: {}

  obs_scales:
    base_ang_vel: 0.5
    projected_gravity: 1.0
    a2_student_dof_pos: 1.0
    a2_student_dof_vel: 0.05
    actions: 1.0
    delta_actions: 1.0
    a2_base_command: 1.0
    a2_base_command_raw: 1.0
    rgb_image: 1.0

    # Active A2 Teacher scales (must remain in lock-step with
    # door_open_a2_base.yaml).
    dof_pos: 1.0
    relative_to_door: 1.0
    dof_vel: 0.05
    door_dof_pos: 1.0
    base_lin_vel: 1.0
    hand_force: 0.01
    stage: 1.0
    privileged_door_info: 1.0
    gripper_handle_transform: 1.0
    transition: 1.0
    complete: 1.0
    time_in_stage: 1.0
    actual_time_in_stage: 1.0
    total_time: 1.0
    a2_base_obs: 1.0

  noise_scales:
    base_ang_vel: 0.0
    projected_gravity: 0.0
    a2_student_dof_pos: 0.01
    a2_student_dof_vel: 0.2
    actions: 0.0
    delta_actions: 0.0
    a2_base_command: 0.0
    a2_base_command_raw: 0.0
    rgb_image: 0.0

    # Active A2 Teacher noise policy.
    dof_pos: 0.01
    relative_to_door: 0.0
    dof_vel: 0.2
    door_dof_pos: 0.0
    base_lin_vel: 0.0
    hand_force: 0.0
    stage: 0.0
    privileged_door_info: 0.0
    gripper_handle_transform: 0.0
    transition: 0.0
    complete: 0.0
    time_in_stage: 0.0
    actual_time_in_stage: 0.0
    total_time: 0.0
    a2_base_obs: 0.0

  # LeggedRobotBase reads this canonical noise-curriculum schema directly.
  # Keep the framework's legacy `currculum` spelling and leave the policy disabled.
  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.00
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 100
  soft_dof_pos_curriculum_level_up_threshold: 900

  # The six-element stage one-hot is part of the active A2 Teacher contract.
  obs_dims:
    - base_ang_vel: 3
    - projected_gravity: 3
    - a2_student_dof_pos: 20
    - a2_student_dof_vel: 20
    - actions: 19
    - delta_actions: 6
    - a2_base_command: 5
    - a2_base_command_raw: 5
    - rgb_image: "${eval:'${simulator.config.cameras.camera_resolutions[0]} * ${simulator.config.cameras.camera_resolutions[1]} * 3'}"
    - dof_pos: 20
    - relative_to_door: 9
    - dof_vel: 20
    - projected_gravity: 3
    - door_dof_pos: 2
    - base_lin_vel: 3
    - hand_force: 6
    - stage: "${eval:'len(${env.config.max_stage_time})'}"
    - privileged_door_info: 8
    - gripper_handle_transform: 18
    - transition: 1
    - complete: 1
    - time_in_stage: 1
    - actual_time_in_stage: 1
    - total_time: 1
    - a2_base_obs: 1620

# @package _global_

# C-B2H-DUALRAW-SHAREDENC-TOEIN20-V19 observation contract.
obs:
  obs_dict:
    actor_obs:
      - base_ang_vel
      - projected_gravity
      - a2_student_dof_pos
      - a2_student_dof_vel
      - actions
      - delta_actions
      - a2_base_command
      - a2_base_command_raw

    # Strict channel order: left D435 RGB [0:3], right D435 RGB [3:6].
    vision_obs:
      - rgb_image
    context_vision_obs:
      - context_rgb_image
    camera_meta:
      - camera_meta

    teacher_obs:
      - dof_pos
      - relative_to_door
      - dof_vel
      - actions
      - projected_gravity
      - door_dof_pos
      - base_lin_vel
      - base_ang_vel
      - hand_force
      - stage
      - privileged_door_info
      - delta_actions
      - gripper_handle_transform
      - a2_base_command_raw
      - a2_base_command

    critic_obs:
      - dof_pos
      - relative_to_door
      - dof_vel
      - actions
      - projected_gravity
      - door_dof_pos
      - base_lin_vel
      - base_ang_vel
      - hand_force
      - stage
      - privileged_door_info
      - delta_actions
      - gripper_handle_transform
      - a2_base_command_raw
      - transition
      - complete
      - time_in_stage
      - actual_time_in_stage
      - total_time
      - a2_base_command

    a2_base_obs:
      - a2_base_obs

  homie_history_length: 5
  obs_auxiliary: {}

  obs_scales:
    base_ang_vel: 0.5
    projected_gravity: 1.0
    a2_student_dof_pos: 1.0
    a2_student_dof_vel: 0.05
    actions: 1.0
    delta_actions: 1.0
    a2_base_command: 1.0
    a2_base_command_raw: 1.0
    rgb_image: 1.0
    context_rgb_image: 1.0
    camera_meta: 1.0
    dof_pos: 1.0
    relative_to_door: 1.0
    dof_vel: 0.05
    door_dof_pos: 1.0
    base_lin_vel: 1.0
    hand_force: 0.01
    stage: 1.0
    privileged_door_info: 1.0
    gripper_handle_transform: 1.0
    transition: 1.0
    complete: 1.0
    time_in_stage: 1.0
    actual_time_in_stage: 1.0
    total_time: 1.0
    a2_base_obs: 1.0

  noise_scales:
    base_ang_vel: 0.0
    projected_gravity: 0.0
    a2_student_dof_pos: 0.01
    a2_student_dof_vel: 0.2
    actions: 0.0
    delta_actions: 0.0
    a2_base_command: 0.0
    a2_base_command_raw: 0.0
    rgb_image: 0.0
    context_rgb_image: 0.0
    camera_meta: 0.0
    dof_pos: 0.01
    relative_to_door: 0.0
    dof_vel: 0.2
    door_dof_pos: 0.0
    base_lin_vel: 0.0
    hand_force: 0.0
    stage: 0.0
    privileged_door_info: 0.0
    gripper_handle_transform: 0.0
    transition: 0.0
    complete: 0.0
    time_in_stage: 0.0
    actual_time_in_stage: 0.0
    total_time: 0.0
    a2_base_obs: 0.0

  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.00
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 100
  soft_dof_pos_curriculum_level_up_threshold: 900

  obs_dims:
    - base_ang_vel: 3
    - projected_gravity: 3
    - a2_student_dof_pos: 20
    - a2_student_dof_vel: 20
    - actions: 19
    - delta_actions: 6
    - a2_base_command: 5
    - a2_base_command_raw: 5
    - rgb_image: 497664
    - context_rgb_image: 156672
    - camera_meta: 6
    - dof_pos: 20
    - relative_to_door: 9
    - dof_vel: 20
    - projected_gravity: 3
    - door_dof_pos: 2
    - base_lin_vel: 3
    - hand_force: 6
    - stage: "${eval:'len(${env.config.max_stage_time})'}"
    - privileged_door_info: 8
    - gripper_handle_transform: 18
    - transition: 1
    - complete: 1
    - time_in_stage: 1
    - actual_time_in_stage: 1
    - total_time: 1
    - a2_base_obs: 1620

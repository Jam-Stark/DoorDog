algo:
    value:
        _recursive_: false
        _target_: groot.rl.agents.ppo.ppo.PPO
        config:
            actor:
                _target_: groot.rl.trl.modules.actor_critic_modules_recurrent.RecurrentActor
                backbone:
                    _target_: groot.rl.agents.modules.modules.BaseModule
                    module_config_dict:
                        input_dim:
                            - actor_obs
                        layer_config:
                            activation: SiLU
                            hidden_dims:
                                - 512
                                - 256
                                - 128
                            type: MLP
                        output_dim:
                            - ${eval:'${algo.config.homie_command_dim} + ${algo.config.non_homie_command_actions_dim}'}
                    process_output_dim: true
                rnn_hidden_dim: 256
                rnn_num_layers: 2
                rnn_type: lstm
                running_mean_std: true
            actor_learning_rate: 0.0001
            clamp_noise_std: true
            clip_param: 0.2
            critic:
                _target_: groot.rl.trl.modules.actor_critic_modules_recurrent.RecurrentCritic
                backbone:
                    _target_: groot.rl.agents.modules.modules.BaseModule
                    module_config_dict:
                        input_dim:
                            - critic_obs
                        layer_config:
                            activation: SiLU
                            hidden_dims:
                                - 512
                                - 256
                                - 128
                            type: MLP
                        output_dim:
                            - 1
                        type: MLP
                    process_output_dim: true
                rnn_hidden_dim: 256
                rnn_num_layers: 2
                rnn_type: lstm
                running_mean_std: true
            critic_learning_rate: 0.0001
            desired_kl: 0.005
            entropy_coef: 0.001
            eval:
                eval_interval: 0
                num_eval_episodes: 200
                num_save_episodes: 200
                save_goal_reached_only: false
                save_trajectories: false
                save_videos: false
                video_save_prob: 0.05
            eval_callbacks: null
            gamma: 0.9975
            global_rank: 0
            homie_command_dim: 3
            homie_stand_model_path: ./models/model_stand.pt
            homie_walk_model_path: ./models/model_walk.pt
            init_at_random_ep_len: true
            init_noise_std: 0.8
            lam: 0.985
            load_optimizer: true
            max_grad_norm: 1
            max_noise_std: 0.8
            module_dict:
                actor:
                    input_dim:
                        - actor_obs
                    layer_config:
                        activation: ELU
                        hidden_dims:
                            - 512
                            - 256
                            - 128
                        type: MLP
                    output_dim:
                        - robot_action_dim
                critic:
                    input_dim:
                        - critic_obs
                    layer_config:
                        activation: ELU
                        hidden_dims:
                            - 512
                            - 256
                            - 128
                        type: MLP
                    output_dim:
                        - 1
                    type: MLP
            non_homie_command_actions_dim: 16
            num_learning_epochs: 5
            num_learning_iterations: 1000000
            num_mini_batches: 4
            num_steps_per_env: 32
            opt_homie: false
            ppo_shuffle_every_epoch: true
            save_interval: 500
            schedule: adaptive
            sync_advantage_normalization: true
            use_clipped_value_loss: true
            use_new_actor_critic: true
            use_padding_mask: false
            value_loss_coef: 1
            world_size: 1
        trl:
            dataset_name: dummy
            disable_tqdm: true
            gamma: ${algo.config.gamma}
            gradient_accumulation_steps: 1
            lam: ${algo.config.lam}
            learning_rate: ${algo.config.actor_learning_rate}
            lr_scheduler_type: constant
            num_mini_batches: ${algo.config.num_mini_batches}
            num_ppo_epochs: ${algo.config.num_learning_epochs}
            num_total_batches: 50000

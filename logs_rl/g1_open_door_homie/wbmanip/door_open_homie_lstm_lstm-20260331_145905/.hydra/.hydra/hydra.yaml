hydra:
  run:
    dir: ${save_dir}
  sweep:
    dir: ${save_dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +exp=wbmanip/door_open_homie_lstm
    - ++num_envs=2
    - ++algo.config.entropy_coef=0.001
    - ++algo.config.num_steps_per_env=32
    - ++env.config.delta_action_scale=0.3
  job:
    name: train_agent_trl
    chdir: false
    override_dirname: ++algo.config.entropy_coef=0.001,++algo.config.num_steps_per_env=32,++env.config.delta_action_scale=0.3,++num_envs=2,+exp=wbmanip/door_open_homie_lstm
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home/ziwang/projects/VIRAL
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ziwang/projects/VIRAL/gr00t/rl/config
      schema: file
      provider: main
    - path: ''
      schema: msc
      provider: msc-universal
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ziwang/projects/VIRAL/logs_rl/g1_open_door_homie/wbmanip/door_open_homie_lstm_lstm-20260331_145905/.hydra
    choices:
      exp: wbmanip/door_open_homie_lstm
      opt: wandb
      obs: wbmanip/door_open_homie
      terrain: terrain_locomotion_plane
      robot: g1/g1_43dof
      rewards: wbmanip/reward_door_open_homie
      domain_rand: NO_domain_rand
      simulator: isaacsim
      env: door_open_homie
      algo: ppo
      algo/eval@algo.config.eval: base
      algo/trl: ppo
      trainer: trl_homie_api
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false

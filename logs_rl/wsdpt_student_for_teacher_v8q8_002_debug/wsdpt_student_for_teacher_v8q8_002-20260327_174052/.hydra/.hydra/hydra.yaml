hydra:
  run:
    dir: ${save_dir}
  sweep:
    dir: ${save_dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +exp=loco_manip/wsdpt_student_for_teacher_v8q8.002_resnet_rgb_delay
    - num_envs=8
    - headless=True
    - experiment_name=wsdpt_student_for_teacher_v8q8_002
    - project_name=wsdpt_student_for_teacher_v8q8_002_debug
  job:
    name: train_agent_trl
    chdir: false
    override_dirname: +exp=loco_manip/wsdpt_student_for_teacher_v8q8.002_resnet_rgb_delay,experiment_name=wsdpt_student_for_teacher_v8q8_002,headless=True,num_envs=8,project_name=wsdpt_student_for_teacher_v8q8_002_debug
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home/ziwang/projects/gr00t-wsg-teleop
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ziwang/projects/gr00t-wsg-teleop/gr00t/rl/config
      schema: file
      provider: main
    - path: ''
      schema: msc
      provider: msc-universal
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ziwang/projects/gr00t-wsg-teleop/logs_rl/wsdpt_student_for_teacher_v8q8_002_debug/wsdpt_student_for_teacher_v8q8_002-20260327_174052/.hydra
    choices:
      exp: loco_manip/wsdpt_student_for_teacher_v8q8.002_resnet_rgb_delay
      opt: wandb
      obs: loco_manip/obs_walk_stand_place_grasp_turn_homie_distill_rgb_delay
      terrain: terrain_locomotion_plane
      robot: g1/g1_43dof
      rewards: loco_manip/reward_wsdpt_butterflyV5_teacher
      domain_rand: wsdpt_student
      simulator: isaacsim
      env: walk_stand_place_grasp_turn_homie
      algo: dagger_vision_distributed
      algo/eval@algo.config.eval: base
      algo/trl: ppo
      trainer: trl_distill_obj_pred_homie_api
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false

                              stride: 2
                              type: pool
                            - kernel_size: 3
                              padding: 1
                              stride: 1
                              type: conv
                            - kernel_size: 2
                              stride: 2
                              type: pool
                            - kernel_size: 3
                              padding: 1
                              stride: 1
                              type: conv
                        norm_config:
                            use_batch_norm: true
                        type: CNN
                    output_dim:

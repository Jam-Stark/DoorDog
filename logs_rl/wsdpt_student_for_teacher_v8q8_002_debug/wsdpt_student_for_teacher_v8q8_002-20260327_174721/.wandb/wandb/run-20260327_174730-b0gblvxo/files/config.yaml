algo:
    value:
        config:
            actor:
                _target_: groot.rl.trl.modules.vision_actor_critic_modules_obj_pred.VisionActorObjPred
                backbone:
                    mlp_module:
                        _target_: groot.rl.agents.modules.modules.BaseModule
                        module_config_dict:
                            input_dim:
                                - actor_obs
                                - vision_feature_dim
                            layer_config:
                                activation: SiLU
                                hidden_dims:
                                    - 512
                                    - 256
                                    - 128
                                type: MLP
                            output_dim:
                                - -1
                        process_output_dim: true
                    obj_pred_mlp:
                        _target_: groot.rl.agents.modules.modules.BaseModule
                        module_config_dict:
                            input_dim:
                                - vision_feature_dim
                            layer_config:
                                activation: SiLU
                                hidden_dims:
                                    - 256
                                    - 128
                                    - 64
                                type: MLP
                            output_dim:
                                - 3
                        process_output_dim: true
                    vision_module:
                        _target_: groot.rl.agents.modules.modules.BaseModule
                        module_config_dict:
                            input_dim:
                                - vision_obs
                            layer_config:
                                pretrained: true
                                resnet_type: resnet18
                                trainable: true
                                type: ResNet
                            output_dim:
                                - vision_feature_dim
                        process_output_dim: true
                running_mean_std: false
            actor_learning_rate: 0.0002
            clamp_noise_std: true
            clip_param: 0.2
            cosine_scheduler_final_lr: 1e-06

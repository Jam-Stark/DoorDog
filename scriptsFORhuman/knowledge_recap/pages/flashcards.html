<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview flashcards</title><link rel="stylesheet" href="../assets/recap.css"><script defer src="../assets/recap.js"></script></head><body><header class="site-head"><div class="shell"><p class="eyebrow">08 · INTERVIEW DRILL</p><h1>先答，再校准</h1><nav class="topnav" aria-label="模块导航"><a href="../index.html">总览</a><a href="system-loops.html">系统双环</a><a href="lifecycle.html">lifecycle</a><a href="tensors.html">tensor</a><a href="ppo.html">PPO</a><a href="reward.html">reward</a><a href="distillation.html">蒸馏</a><a href="sim2sim.html">sim2sim</a><a aria-current="page" href="flashcards.html">卡片</a></nav></div></header>
<main class="shell"><section class="hero"><p class="lead">把答案控制在“结论 → 原理 → 项目锚点 → 边界”四句。翻面前先自己说完；点击卡片区后也可按 <span class="kbd">Space</span> 翻面。</p></section><section class="flash-wrap" data-flashcards data-cards='[{"group":"PPO","q":"PPO 的 clip 到底 clip 了什么？","a":"clip 的是新旧策略对同一已采样 action 的概率比率 r，不是直接裁 action。它抑制单一 batch 将策略分布推得过远，近似 trust-region 式稳定更新。","formula":"Lclip = min(rA, clip(r,1−ε,1+ε)A), ε=.2","follow":"若 A<0，clip 怎样工作？为什么仍需要 KL/clipfrac 监控？","source":"gr00t/rl/trl/trainer/ppo_trainer_a2_base_api.py"},{"group":"GAE","q":"γ 与 λ 分别调什么？","a":"γ 决定未来奖励的时间折扣；λ 决定 GAE 在低方差 TD 与低偏差 Monte Carlo 间的权衡。当前 overlay 使用 γ=.9975、λ=.985，适合较长控制时程但仍需 critic 稳定估值。","formula":"A^GAE_t = Σ(γλ)^l δ_(t+l)","follow":"lambda=0 与 lambda=1 分别接近什么估计？","source":"current A2_Piper overlay / PPO config"},{"group":"IsaacLab","q":"4096 个环境 done 后如何 reset？","a":"done 是 shape [N] 的 mask。每个 step 后只取 done 为真的 env_ids 清理 episode state、stage 与 history，再采样新初始条件；其他环境继续，不能全局 reset。","formula":"env_ids = where(done); reset(env_ids)","follow":"reset 漏清 previous action 或 history 会造成什么？","source":"gr00t/rl/envs/door/door_open_a2_base.py"},{"group":"Tensor","q":"为什么是 high12 → env24 → logical19 → sim20？","a":"12D high-level 是 base5、arm6、gripper1；frozen A2_Base 额外给 12D leg，合成环境入口 24D。控制语义重排为 leg12、arm6、gripper1 的 19D；一个 gripper primitive 展开为两个 simulator joint target，所以最终 20D。","formula":"12 + 12 = 24; 12 + 6 + 1 = 19 → 20","follow":"shape 对了，channel order 错了会怎样？","source":"distill_trainer_a2_base_api.py::compose_a2_rollout_action"},{"group":"Reward","q":"reward 高能否说明任务成功？","a":"不能。reward 是训练中的逐步代理信号；success 由终止语义和独立评估协议决定。开门中必须同时审计 door state、接触、terminal reason 和跨环境指标，防止策略刷局部 shaping。","formula":"reward proxy ≠ success metric","follow":"怎样用 grasp gate 减少 reward hacking？","source":"reward_door_open_a2_base.yaml / door_open_a2_base.py"},{"group":"Distillation","q":"DAgger 为什么比只离线模仿更合适？","a":"Student 会走到 teacher dataset 覆盖不到的状态，误差会累积。DAgger 让 student 自己 rollout，再询问 teacher 在这些 state 的 action，把训练分布拉向部署分布。项目 Student 是 81D proprio 加视觉/LSTM，输出仍是 12D high-level。","formula":"s ~ d_student; target = a_teacher(s)","follow":"action MSE 低为什么仍不保证 closed-loop 成功？","source":"distillation branch: distill_trainer_a2_base_api.py"},{"group":"GRPO","q":"项目是否已完成 Student 的 Phase3 GRPO？","a":"没有。memory 中明确完整 Phase3 Student bootstrapping / GRPO fine-tuning 尚未实现。面试应把它表述为未来路线或已核查边界，不能把算法名当成已验证结果。","formula":"implemented evidence > planned method name","follow":"若要实现，至少要先固定哪些 reward、rollout、eval contract？","source":"memory/a2-piper/phase3-student-bootstrapping/description.md"},{"group":"sim2sim","q":"为什么不能说 MuJoCo 跑通就证明 Isaac parity？","a":"两个引擎的画面或有限轨迹不足以证明 action、timebase、contact、reset 和 door semantics 对齐。正式 E5 仍缺 matching Isaac paired trace；r7 只支持视觉域差结论，不能升级成动态或策略等价。","formula":"visual similarity ≠ paired trajectory parity","follow":"paired comparator 的 discrete 与 float 字段为何要不同判断？","source":"sim2sim PROGRESS.md / source_map.md"}]'><div class="flashcard"><div class="flash-face" data-question></div><div class="flash-face" data-answer></div></div><div class="controls"><button class="button" type="button" data-prev-card>上一张</button><button class="button primary" type="button" data-flip>翻面 / Space</button><button class="button" type="button" data-next-card>下一张</button><span class="status" data-card-index></span></div><p class="status" aria-live="polite" data-flash-live></p></section><section class="section source-card"><div class="source-row"><strong>使用提醒</strong><span class="evidence inspected">项目事实已写入卡片</span></div><p>这些回答刻意把“已实现/已观察/仍 blocked”分开。面试中若被追问运行结果，先说证据等级和实验条件，再说结论。</p></section></main><footer><div class="shell">复习完成后回到总览按薄弱模块重练。</div></footer></body></html>

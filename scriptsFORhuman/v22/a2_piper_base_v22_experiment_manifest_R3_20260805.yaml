# ---------------------------------------------------------------------------
# POSTURE GATES -- unresolved by type, not by omission.
# Repairs revision-2 absolute thresholds that measurement showed unreachable.
# ---------------------------------------------------------------------------
posture:
  posture_gate_state: P0_CALIBRATION_REQUIRED
  posture_baseline_artifact: null
  posture_denominator_adjudication_artifact: null
  posture_gate_freeze_artifact: null
  posture_need_state: null

  withdrawn_revision2_absolute_gates:
    reason: >-
      Measured on the exact frozen B1@500 warm start over all available frames, all six
      revision-2 posture gates fail in both STANDARD and RELAXED_1; roll p50 by 6.4x.
      Posture-economy shaping is additionally a closed dead end in this project
      (v16 -0.15 and v17 -1.5 ~12% of income both failed; P2 proved pitch load-bearing).
    withdrawn:
      ordinary_pitch_p50_max_rad: [0.10, 0.15]
      ordinary_pitch_p95_max_rad: [0.25, 0.30]
      ordinary_roll_p50_max_rad: [0.06, 0.10]
      ordinary_roll_p95_max_rad: [0.18, 0.22]
      ordinary_pitch_saturation_max: [0.08, 0.15]
      status: NOT_PREREGISTERED_RELEASE_BLOCKERS

  diagnostic_measurement_non_binding:
    provenance: trace fields root_pitch / root_roll = ACHIEVED trunk angle, NOT command
    scope: all frames, not the ordinary_need_negative denominator
    binding: false
    source: logs_eval/base_v21B/postformal_20260804_route_b_b1_pooled48_r24
    achieved_pitch_p50_rad: 0.2358
    achieved_pitch_p95_rad: 0.3524
    achieved_roll_p50_rad: 0.3840
    achieved_roll_p95_rad: 0.4296
    achieved_roll_saturation_at_0p95_of_0p40: 0.569
    v20_g4_step2500_reference:
      achieved_pitch_p50_rad: 0.2837
      achieved_roll_p50_rad: 0.3185
      achieved_roll_saturation: 0.262
    prohibition: >-
      These values may not be converted into absolute gates such as roll p50 <= 0.30 or
      pitch p50 <= 0.20. They justify withdrawing the revision-2 gates only.

  p0_posture_baseline:
    node_id: P0-POSTURE-BASELINE
    raw_producer:
      checkpoint: frozen B1@500, exact
      optimizer_update: false
      action_intervention_primary_baseline: none
      posture_need: telemetry_only_no_reward_no_action_effect
    ordinary_need_negative_frame_definition:
    - scenario belongs to E0_CORE / ordinary16
    - stage is OPEN or SWING
    - valid task-space/reference state
    - no body-assist eligibility and no body contact
    - not a terminal-only frame
    - posture_need_score <= 0.35
    required_published_fields:
    - total_ordinary_frames
    - ordinary_need_negative_frames
    - contributing_episode_count
    - fraction_of_ordinary_frames_need_negative
    - per_episode_and_pooled_command_distributions
    - commanded_pitch_roll_separately
    - achieved_pitch_roll_separately
    - command_saturation_rates
    - posture_need_component_prevalences_individually
    - source_checkpoint_config_hashes
    binding_denominator_minimums:
      contributing_episodes_min: 8
      contributing_episodes_denominator: 16
      ordinary_need_negative_frames_min: 1000
    insufficient_denominator_state: REPORT_ONLY_INSUFFICIENT_DENOMINATOR
    insufficient_denominator_effect: >-
      Posture gates must not block pilot, formal training, Route A, Route B, or a
      research-complete result.
    vacuity_threshold_fraction_of_valid_ordinary_opening_frames: 0.25
    vacuity_state: POSTURE_NEED_OVERACTIVE_OR_VACUOUS
    vacuity_effect: >-
      Worker may continue; posture_need precision and ordinary-posture release claims
      become report-only until corrected in the authorized adaptation window.
    outputs:
    - V22_POSTURE_BASELINE.json
    - V22_POSTURE_DENOMINATOR_ADJUDICATION.json
    - V22_POSTURE_GATE_FREEZE.json
    consumes_method_amendment: false
    consumes_waiver_budget: false
    consumes_window_c: false

  posture_need_precision_rule:
    binding_only_if_labels_independent: true
    independent_label_source: P0-B frozen causal intervention (zero/clamped posture vs unchanged policy)
    if_labels_derived_from_posture_need_signals: CIRCULAR_REPORT_ONLY

  gate_form: same_denominator_warm_start_relative
  gate_side: command
  standard:
    pitch_command_p50_max_multiplier_of_B0: 0.85
    roll_command_p50_max_multiplier_of_B0: 0.80
    roll_saturation_max_multiplier_of_B0: 0.70
    pitch_p95_max_offset_rad_over_B0: 0.05
    roll_p95_max_offset_rad_over_B0: 0.05
    ordinary_goal_regression_max_of_16: 1
    ordinary_clearance_success_regression_max_of_16: 1
  relaxed_1:
    pitch_command_p50_max_multiplier_of_B0: 0.95
    roll_command_p50_max_multiplier_of_B0: 0.90
    roll_saturation_max_multiplier_of_B0: 0.85
    pitch_p95_max_offset_rad_over_B0: 0.08
    roll_p95_max_offset_rad_over_B0: 0.08
    ordinary_goal_regression_max_of_16: 2
    ordinary_clearance_success_regression_max_of_16: 2
  refinement_rule: >-
    Formulas may be refined only by citing a stronger measured basis. They may not be
    replaced by new unmeasured absolute values.

# ---------------------------------------------------------------------------
# HINGE RANDOMIZATION -- ranges unfrozen pending P0-D.
# ---------------------------------------------------------------------------
randomization:
  hinge_randomization_state: P0_D_REQUIRED_UNFROZEN
  final_bucket_ranges: null
  final_bucket_weights: null
  hinge_range_freeze_artifact: null
  freeze_artifact_path: logs_eval/base_v22/locks/V22_HINGE_RANGE_FREEZE.json
  provisional_candidate_ranges_location: >-
    plan Appendix A, labelled PROVISIONAL_CANDIDATE_RANGES_NOT_AUTHORIZED_FOR_FORMAL_TRAINING

  retained_axes:
    handle_height_m: [0.85, 1.10]
    door_mass_kg: [80, 160]

  new_hinge_axes:
  - hinge_drive_damping_native
  - hinge_drive_stiffness_native
  - hinge_drive_max_force_nm

  worker_adjustable_bounds:
    damping_native: [10, 200]
    stiffness_native: [0.5, 30]
    max_force_nm: [2.5, 24]
    mass_kg: [80, 180]
    handle_height_m: [0.85, 1.10]

  evaluation_manifests:
    state: CONSTRUCTED_AFTER_P0_D
    names: [E0_CORE16, E1_DAMPING16, E2_REBOUND16, E3_RESISTIVE16, E4_COMPOUND16]
    rows_each: 16
    immutable_after: window_A

  source_execution_gap:
    verified_on_host: true
    hinge_damping_is_randomizable: false
    hinge_damping_read_path: door.py:971 hinge_drive.GetDampingAttr().Get()
    hinge_damping_consumed_at: door_open_a2_base.py:6347
    rand_hinge_drive_stiffness_exists: true
    rand_hinge_drive_max_force_exists: true
    rand_hinge_drive_damping_exists: false
    metadata_binds_damping: false
    traces_carry_damping_and_stiffness: false
    revision_2_assumed_damping_value: 50.0
    revision_2_assumed_damping_verified: false

  required_plumbing:
    door_py:
    - add hinge_drive_damping_range
    - add rand_hinge_drive_damping
    - validate finite non-negative values
    - set runtime USD drive damping from sampled/fixed value
    - serialize damping into metadata
    - restore damping from metadata
    generate_door_assets_py:
    - generate and export damping
    - include damping in metadata.json
    scenario_cfg_isaacsim_py:
    - bind deterministic damping, stiffness, and max force per scenario
    - validate exact ordered values and hashes
    evidence_export:
    - door_hinge_drive_damping_native
    - door_hinge_drive_stiffness_native
    - door_hinge_drive_max_force_nm
    - door_hinge_drive_target_rad
    - measured_free_return_class
    - registered_hinge_bucket
    binding_rule: >-
      No accepted record may infer bucket membership from a scenario name alone; runtime
      values must match the signed scenario manifest.

  p0_d:
    node_id: P0-D
    runtime_attributes_to_read_first:
    - hinge_drive.GetDampingAttr().Get()
    - hinge_drive.GetStiffnessAttr().Get()
    - hinge_drive.GetMaxForceAttr().Get()
    probes:
    - free_return_from_fixed_angle_1.20_rad
    - fixed_external_opening_torque_5_10_15_20_nm
    - damping_stiffness_maxforce_attribution
    response_classes: [CORE, HIGH_DAMPING, FAST_REBOUND, HIGH_RESISTIVE, COMPOUND, UNCLASSIFIED]
    outputs:
    - V22_HINGE_RUNTIME_BASELINE.json
    - V22_HINGE_DYNAMICS_PROBE.json
    - V22_HINGE_RANGE_FREEZE.json
    range_selection_authorized: true
    consumes_window_c: false
    consumes_waiver_budget: false

clearance_strategies: [FLING_CLEARANCE, HAND_HOLD_CLEARANCE, BODY_HOLD_CLEARANCE]
clearance_policy:
  minimum_fling_rate: null
  generic_coast_penalty: false
  fling_may_fail_on_hard_doors: true
  fast_rebound_vs_high_damping_distinction_preserved: true

body_assist:
